{% load static %}
<!doctype html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#12271d">
    <meta name="color-scheme" content="light">
    <link rel="icon" href="{% static 'school/images/favicon.svg' %}" type="image/svg+xml">
    <link rel="stylesheet" href="{% static 'school/css/typography.css' %}?v=20260912-font-1">
    <link rel="stylesheet" href="{% static 'school/css/brand.css' %}?v=20260912-card-theme-1">
    <title>{% block title %}BRI School of Fivefold{% endblock %}</title>
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}
    {% block extra_js %}{% endblock %}
</body>
</html>
