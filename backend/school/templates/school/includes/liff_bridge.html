{% load static %}
{% if line_liff_id %}

    data-liff-config

></div>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js" defer></script>
<script src="{% static 'school/js/liff_bridge.js' %}?v=20260813-liff-boot" defer></script>
{% endif %}
